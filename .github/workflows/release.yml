name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    outputs:
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          mise exec -- node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release/release-notes.md"
          version_without_build=${RELEASE_TAG%%+*}
          if [[ "$version_without_build" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - run: mise run setup
      - run: mise run check
      - run: mise run test
      - name: Package prebuilt Worker
        shell: bash
        run: |
          package_name="shard-${RELEASE_TAG}-worker"
          export PACKAGE_DIR="$RUNNER_TEMP/$package_name"
          mkdir -p "$PACKAGE_DIR/scripts" "$PACKAGE_DIR/src"
          cp -R build static migrations worker containers "$PACKAGE_DIR/"
          cp src/git_wire.js "$PACKAGE_DIR/src/"
          cp .node-version .dockerignore package.json package-lock.json CHANGELOG.md "$PACKAGE_DIR/"
          cp node_modules/openpgp/LICENSE "$PACKAGE_DIR/OPENPGP-LICENSE"
          cp scripts/deploy.mjs scripts/git-origin.mjs scripts/git-lfs-r2-multipart.mjs "$PACKAGE_DIR/scripts/"
          mise exec -- node <<'JS'
          const { writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const { rawConfig } = require('wrangler').experimental_readRawConfig({ config: 'wrangler.jsonc' });
          delete rawConfig.$schema;
          delete rawConfig.build;
          writeFileSync(join(process.env.PACKAGE_DIR, 'wrangler.json'), JSON.stringify(rawConfig, null, 2) + '\n');
          JS
          ln -s "$PWD/node_modules" "$PACKAGE_DIR/node_modules"
          mise exec -- node "$PACKAGE_DIR/scripts/deploy.mjs" --config "$PACKAGE_DIR/wrangler.json" --dry-run --outdir "$RUNNER_TEMP/bundled"
          mise exec -- node "$PACKAGE_DIR/scripts/deploy.mjs" --config "$PACKAGE_DIR/wrangler.json" --env native --dry-run --outdir "$RUNNER_TEMP/bundled-native"
          mise exec -- node "$PACKAGE_DIR/scripts/deploy.mjs" --config "$PACKAGE_DIR/wrangler.json" --env artifacts --dry-run --outdir "$RUNNER_TEMP/bundled-artifacts"
          mise exec -- node "$PACKAGE_DIR/scripts/deploy.mjs" --config "$PACKAGE_DIR/wrangler.json" --paid --dry-run --outdir "$RUNNER_TEMP/bundled-paid"
          mise exec -- node "$PACKAGE_DIR/scripts/deploy.mjs" --config "$PACKAGE_DIR/wrangler.json" --paid --env managed-staging --dry-run --outdir "$RUNNER_TEMP/bundled-paid-staging"
          unlink "$PACKAGE_DIR/node_modules"
          cd "$RUNNER_TEMP/release"
          tar -C "$RUNNER_TEMP" -czf "$package_name.tar.gz" "$package_name"
          sha256sum "$package_name.tar.gz" > "$package_name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: shard-worker-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shard-worker-release
          path: ${{ runner.temp }}/release
      - name: Publish GitHub Release
        working-directory: ${{ runner.temp }}/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          package_name="shard-${RELEASE_TAG}-worker.tar.gz"
          sha256sum --check "$package_name.sha256"
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            exit 0
          fi
          flags=(--prerelease=false)
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            flags=(--prerelease --latest=false)
          fi
          notes=(--title "Shard $RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$draft" != true ]]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag "${notes[@]}"
          fi
          gh release upload "$RELEASE_TAG" "$package_name" "$package_name.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${notes[@]}" "${flags[@]}"
