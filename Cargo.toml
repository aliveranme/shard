[package]
name = "shard"
version = "0.4.0"
edition = "2021"
description = "Shard - a self-hosted, Cloudflare-native Git forge"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.9", features = ["d1"] }
worker-macros = "0.9"
askama = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
html5gum = { version = "0.9.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.23"
urlencoding = "2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
