# Shard toolchain + tasks. Everything runs through mise so the repo is self-contained.
[tools]
rust = "1.100.0"
node = "26.13.1"

[env]
CARGO_TERM_COLOR = "always"
WRANGLER_SEND_METRICS = "false"

[tasks.setup]
description = "Install the pinned Rust toolchain components, worker-build and Node dependencies"
run = """
rustup target add wasm32-unknown-unknown
rustup component add rust-analyzer rust-src rustfmt clippy
cargo install worker-build --version 0.9.0 --locked
cargo fetch --locked
npm ci --no-audit --no-fund
"""

[tasks.dev]
description = "Run shard locally with the Artifacts simulator and a local D1"
depends = ["db:migrate"]
run = "node node_modules/wrangler/bin/wrangler.js dev --local"

[tasks.build]
description = "Build the Worker bundle"
run = "worker-build --release"

[tasks.deploy]
description = "Apply D1 migrations and deploy to Cloudflare"
run = """
node node_modules/wrangler/bin/wrangler.js d1 migrations apply shard --remote
worker-build --release
node node_modules/wrangler/bin/wrangler.js deploy
"""

[tasks.check]
description = "Type-check the Worker for wasm32"
run = "cargo check --locked --target wasm32-unknown-unknown"

[tasks.lint]
description = "Run Clippy for the wasm Worker"
run = "cargo clippy --locked --target wasm32-unknown-unknown"

[tasks.test]
description = "Build and run isolated local HTTP regression tests"
depends = ["build"]
run = "node --test tests/http.test.mjs"

[tasks.fmt]
description = "Format the Rust sources"
run = "cargo fmt"

[tasks."db:migrate"]
description = "Apply migrations to the local D1 database"
run = "node node_modules/wrangler/bin/wrangler.js d1 migrations apply shard --local"

[tasks."db:console"]
description = "Open a SQL console against the local D1 database"
run = "node node_modules/wrangler/bin/wrangler.js d1 execute shard --local --command \"select name from sqlite_master where type='table'\""
