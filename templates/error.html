{% extends "base.html" %}
{% block content %}
<div class="page" style="padding:72px 0">
  <div class="card card--warm" style="max-width:720px;margin:0 auto;text-align:center">
    <p class="eyebrow">Something went sideways</p>
    <h1 class="hero__title" style="font-size:clamp(3rem,10vw,6rem)">{{ status }}</h1>
    <p class="muted" style="margin:16px auto 28px;max-width:32rem">{{ message }}</p>
    <a class="btn btn--primary" href="/">Back to your dashboard</a>
  </div>
</div>
{% endblock %}
