{% extends "base.html" %}
{% block content %}
<div class="page error-page">
  <div class="card card--warm error-card">
    <p class="eyebrow">{{ chrome.locale.t(crate::i18n::CommonText::ErrorHeading) }}</p>
    <h1 class="hero__title error-card__code">{{ status }}</h1>
    <p class="muted error-card__msg">{{ message }}</p>
    <a class="btn btn--primary" href="/">{{ chrome.locale.t(crate::i18n::CommonText::BackToDashboard) }}</a>
  </div>
</div>
{% endblock %}
