{% extends "base.html" %}
{% block content %}
<div class="ui container">
  <h1>New repository</h1>
  {% if let Some(message) = error %}
    <div class="ui negative message">{{ message }}</div>
  {% endif %}
  <form class="ui form" method="post" action="/repo/create">
    <div class="field">
      <label for="name">Repository name</label>
      <input id="name" name="name" value="{{ name_value }}" placeholder="hello-world" required>
      <span class="help">Letters, digits, dot, dash or underscore.</span>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <input id="description" name="description" value="{{ description_value }}" placeholder="What is this repository for?">
    </div>
    <div class="field">
      <label>
        <input type="checkbox" name="private" {% if private_checked %}checked{% endif %}>
        Private &mdash; only you can see it
      </label>
    </div>
    <button class="ui primary button" type="submit">Create repository</button>
  </form>
</div>
{% endblock %}
