<div id="reactions" class="form__actions stack-sm" role="group" aria-label="{{ chrome.locale.t(crate::i18n::RepoFeatureText::Reactions) }}">
  {% for reaction in reactions %}
    {% if chrome.signed_in %}
      <form method="post" action="/{{ repo.owner_name }}/{{ repo.name }}/issues/{{ issue.number }}/reactions?comments_page={{ pagination.page }}">
        {% include "csrf.html" %}
        <input type="hidden" name="reaction" value="{{ reaction.kind }}">
        <button class="btn btn--ghost btn--sm" type="submit" name="active" value="{% if reaction.active %}0{% else %}1{% endif %}" aria-pressed="{{ reaction.active }}">
          {{ reaction.label(chrome.locale) }} <span class="badge badge--count{% if reaction.active %} badge--open{% endif %}">{{ reaction.count }}</span>
        </button>
      </form>
    {% else %}
      <span class="badge badge--count">{{ reaction.label(chrome.locale) }} {{ reaction.count }}</span>
    {% endif %}
  {% endfor %}
</div>
