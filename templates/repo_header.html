<div class="secondary-nav">
  <div class="ui container">
    <div class="repo-header">
      <div class="flex-item tw-items-center">
        <div class="flex-item-leading">
          <svg class="octicon repo-icon" viewBox="0 0 16 16" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path></svg>
        </div>
        <div class="flex-item-main">
          <div class="flex-item-title tw-font-normal">
            <a class="muted" href="/{{ repo.owner_name }}">{{ repo.owner_name }}</a>/<a class="muted tw-font-semibold" href="/{{ repo.owner_name }}/{{ repo.name }}">{{ repo.name }}</a>
            {% if repo.is_private() %}<span class="ui label">Private</span>{% endif %}
          </div>
          {% if !repo.description.is_empty() %}
            <div class="text muted">{{ repo.description }}</div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
<div class="ui container">
  <div class="ui secondary pointing tabular top attached borderless menu tw-pt-0">
    <a class="item{% if tab == "code" %} active{% endif %}" href="/{{ repo.owner_name }}/{{ repo.name }}">
      Code
    </a>
    <a class="item{% if tab == "commits" %} active{% endif %}" href="/{{ repo.owner_name }}/{{ repo.name }}/commits">
      Commits
    </a>
    <a class="item{% if tab == "issues" %} active{% endif %}" href="/{{ repo.owner_name }}/{{ repo.name }}/issues">
      Issues <span class="ui small label">{{ repo.open_issues }}</span>
    </a>
    <a class="item{% if tab == "pulls" %} active{% endif %}" href="/{{ repo.owner_name }}/{{ repo.name }}/pulls">
      Pull requests <span class="ui small label">{{ repo.open_pulls }}</span>
    </a>
    {% if is_owner %}
      <a class="item{% if tab == "settings" %} active{% endif %}" href="/{{ repo.owner_name }}/{{ repo.name }}/settings">
        Settings
      </a>
    {% endif %}
  </div>
</div>
